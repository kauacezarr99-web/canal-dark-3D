name: Renderizar Video 3D
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar ManimGX
        run: pip install manimgx

      - name: Renderizar o Video
        run: manimgx render cena_dark.py CenaDark -r 1920x1080 --preset medium

      - name: Salvar o Video (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: video-3d-final
          path: CenaDark.mp4
